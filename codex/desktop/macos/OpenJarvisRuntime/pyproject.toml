[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisdai-openjarvis-runtime"
version = "0.1.0"
description = "Managed Apache-2.0 OpenJarvis runtime and WisdAI native bridge (stripped of GPL/PyTorch bloat)"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
    "aiohttp>=3.14.4",
    "av>=11,<19",
    "click>=8",
    "croniter>=2.0",
    "fastapi>=0.110",
    "faster-whisper>=1.0",
    "fsspec>=2026.6.0",
    "httpx>=0.27",
    "numpy>=1.24",
    "openai>=1.30",
    "psutil>=5.9",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "requests>=2.33.0",
    "rich>=13",
    "soundfile>=0.12",
    "tomlkit>=0.12",
    "uvicorn>=0.30",
    "websockets>=15.0.1",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["openjarvis*", "wisdai_bridge*"]
